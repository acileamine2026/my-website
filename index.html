<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>موقعي التعليمي</title>

<style>

body{
  font-family: Arial;
  background: linear-gradient(120deg, #74ebd5, #acb6e5);
  text-align: center;
  margin: 0;
}

/* صندوق المحتوى */
.card{
  background: white;
  width: 60%;
  margin: 50px auto;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.2);
}

/* العنوان */
h1{
  font-size: 40px;
  color: #333;
}

/* النص */
p{
  font-size: 18px;
  color: #555;
}

/* الزر */
button{
  background: #007bff;
  color: white;
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
}

button:hover{
  background: #0056b3;
}

</style>

</head>

<body>

<div class="card">

  <h1>👋 مرحبًا بك في موقعي التعليمي</h1>

  <p>دروس في البرمجة خطوة خطوة بطريقة سهلة</p>

  <a href="./lessons.html">
    <button>اذهب إلى الدروس</button>
  </a>

</div>

</body>
</html>
